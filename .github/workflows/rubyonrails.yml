name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: redmine
          POSTGRES_PASSWORD: redmine
          POSTGRES_DB: redmine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U redmine -d redmine_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      RAILS_ENV: test
      REDMINE_DB_DATABASE: redmine_test
      REDMINE_DB_HOST: 127.0.0.1
      REDMINE_DB_USERNAME: redmine
      REDMINE_DB_PASSWORD: redmine

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Gemfile.lock platform
        run: |
          if [ -f Gemfile.lock ] && ! grep -q "x86_64-linux" Gemfile.lock; then
            echo "❌ Gemfile.lock missing x86_64-linux platform"
            echo "Run locally: bundle lock --add-platform x86_64-linux"
            exit 1
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
          bundler-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Configure database
        run: |
          mkdir -p config
          cat > config/database.yml <<'YAML'
          test:
            adapter: postgresql
            encoding: unicode
            database: redmine_test
            host: 127.0.0.1
            username: redmine
            password: redmine
            pool: 5
          YAML

      - name: Generate secret token
        run: bundle exec rake generate_secret_token

      - name: Prepare database
        run: bundle exec rails db:prepare

      - name: Run tests
        run: bundle exec rake test

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-artifacts
          path: |
            log/
            tmp/
            coverage/
            test/reports/
          if-no-files-found: ignore
