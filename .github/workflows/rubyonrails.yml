name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      RAILS_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Gemfile.lock platform
        run: |
          if [ -f Gemfile.lock ] && ! grep -q "x86_64-linux" Gemfile.lock; then
            echo "❌ Gemfile.lock missing x86_64-linux platform"
            echo "Run locally: bundle lock --add-platform x86_64-linux"
            exit 1
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
          bundler-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Configure database
        run: |
          mkdir -p config
          cat > config/database.yml <<'YAML'
          test:
            adapter: sqlite3
            database: db/test.sqlite3
            pool: 5
            timeout: 5000
          YAML

      - name: Generate secret token
        run: |
          bundle exec rake generate_secret_token

      - name: Prepare database
        run: |
          bundle exec rails db:prepare

      - name: Run tests
        run: |
          bundle exec rake test

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-artifacts
          path: |
            log/
            tmp/
            coverage/
            test/reports/
          if-no-files-found: ignore
