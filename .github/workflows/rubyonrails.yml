name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-queue-demo
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      RAILS_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 🧠 Ensure lockfile works on Linux (fails fast if not fixed)
      - name: Check Gemfile.lock platform
        run: |
          if ! grep -q "x86_64-linux" Gemfile.lock; then
            echo "❌ Gemfile.lock missing x86_64-linux platform"
            echo "Run locally: bundle lock --add-platform x86_64-linux"
            exit 1
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
          bundler-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Configure database
        run: |
          cp config/database.yml.example config/database.yml

      - name: Generate secret token
        run: bundle exec rake generate_secret_token

      - name: Prepare database
        run: bundle exec rails db:prepare

      - name: Run tests
        run: bundle exec rake test

      # 📦 Always upload artifacts (even if tests fail)
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-artifacts
          path: |
            log/
            tmp/
            coverage/
            test/reports/
