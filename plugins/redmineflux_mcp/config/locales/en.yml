  text_redmineflux_mcp_summary: "Install this plugin, add the MCP server entry in Claude Desktop, and start using Redmine tools from Claude."
  text_redmineflux_mcp_config_hint: "Copy this JSON into your Claude Desktop configuration file. This recommended config does not require API key hardcoding."
  text_redmineflux_mcp_login_hint: "After Claude starts, run login_redmine once with your Redmine username and password."
  text_redmineflux_mcp_tip: "No API key is required in Claude config when you use login_redmine."
  text_redmineflux_mcp_restart_hint: "After saving config, restart Claude Desktop and the server will be auto-started when Claude connects."
  text_redmineflux_mcp_optional_api_key_hint: "Use this only if you want direct API key auth from config."
  text_redmineflux_mcp_server_url_hint: "Optional override. Leave blank to use Redmine protocol + host name settings."
  text_redmineflux_mcp_jwt_secret_hint: "Optional. If empty, the plugin falls back to Rails secret_key_base."
